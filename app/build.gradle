plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.echos.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.echos.app'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '1.3.0'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('ECHOS_KEYSTORE_PATH')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('ECHOS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ECHOS_KEY_ALIAS')
                keyPassword System.getenv('ECHOS_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Standard Android debug signature (v1/v2), suitable for installation tests.
        }
        release {
            minifyEnabled false
            if (System.getenv('ECHOS_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
}
