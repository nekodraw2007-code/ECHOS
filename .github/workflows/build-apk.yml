name: Build ECHOS APK

on:
  workflow_dispatch:
  push:
    branches: [main, feature/dictionary-selection-no-repeat]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Compile installable debug APK
        run: gradle --no-daemon clean :app:assembleDebug
      - name: Verify debug APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee debug-certificate.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-metadata.txt
          grep -q "package: name='com.echos.app'" apk-metadata.txt
          unzip -t "$APK" | tail -n 2
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ECHOS-APK-DEBUG-VERIFIED
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish OAuth certificate diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: ECHOS-OAUTH-CERTIFICATE-DIAGNOSTIC
          path: |
            debug-certificate.txt
            apk-metadata.txt
          if-no-files-found: error
          retention-days: 30
      - name: Package official Android signing tools
        run: tar -czf "$RUNNER_TEMP/android-build-tools-35.0.0.tar.gz" -C "$ANDROID_HOME/build-tools" 35.0.0
      - name: Upload official Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: ECHOS-ANDROID-BUILD-TOOLS
          path: ${{ runner.temp }}/android-build-tools-35.0.0.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Restore permanent release signing key
        if: ${{ secrets.ECHOS_KEY_ENCRYPTION_PASSWORD != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          KEY_PASSWORD: ${{ secrets.ECHOS_KEY_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/echos-signing"
          gh release download echos-signing-key-v1 --repo "$GITHUB_REPOSITORY" --pattern echos-release.jks.enc --dir "$RUNNER_TEMP/echos-signing"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$RUNNER_TEMP/echos-signing/echos-release.jks.enc" -out "$RUNNER_TEMP/echos-release.jks" -pass env:KEY_PASSWORD
          echo "ECHOS_KEYSTORE_PATH=$RUNNER_TEMP/echos-release.jks" >> "$GITHUB_ENV"
          echo "ECHOS_KEYSTORE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ECHOS_KEY_ALIAS=echos-upload" >> "$GITHUB_ENV"
          echo "ECHOS_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build permanent-key release APK
        if: ${{ secrets.ECHOS_KEY_ENCRYPTION_PASSWORD != '' }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify permanent-key release APK matches permanent keystore
        if: ${{ secrets.ECHOS_KEY_ENCRYPTION_PASSWORD != '' }}
        env:
          KEY_PASSWORD: ${{ secrets.ECHOS_KEY_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          keytool -list -v -keystore "$RUNNER_TEMP/echos-release.jks" -storepass "$KEY_PASSWORD" -alias echos-upload > expected-certificate.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee release-certificate.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.echos.app'"
          EXPECTED=$(awk '/SHA1:/{print $2; exit}' expected-certificate.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')
          ACTUAL=$(sed -n 's/.*SHA-1 digest: //p' release-certificate.txt | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test -n "$EXPECTED" && test "$EXPECTED" = "$ACTUAL" || { echo "ERROR: APK signature differs from permanent keystore."; exit 1; }
          echo "Permanent SHA-1: $ACTUAL"
      - name: Upload permanent-key release APK
        if: ${{ secrets.ECHOS_KEY_ENCRYPTION_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ECHOS-APK-RELEASE-SIGNED
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
