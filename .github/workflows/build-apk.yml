name: Build ECHOS APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.ECHOS_KEYSTORE_BASE64 != '' && secrets.ECHOS_KEYSTORE_PASSWORD != '' && secrets.ECHOS_KEY_ALIAS != '' && secrets.ECHOS_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Compile installable debug APK
        run: gradle --no-daemon clean :app:assembleDebug
      - name: Verify debug APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-metadata.txt
          grep -q "package: name='com.echos.app'" apk-metadata.txt
          unzip -t "$APK" | tail -n 2
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ECHOS-APK-DEBUG-VERIFIED
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Package official Android signing tools
        run: tar -czf "$RUNNER_TEMP/android-build-tools-35.0.0.tar.gz" -C "$ANDROID_HOME/build-tools" 35.0.0
      - name: Upload official Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: ECHOS-ANDROID-BUILD-TOOLS
          path: ${{ runner.temp }}/android-build-tools-35.0.0.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Prepare permanent release signing key
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          ECHOS_KEYSTORE_BASE64: ${{ secrets.ECHOS_KEYSTORE_BASE64 }}
        run: |
          echo "$ECHOS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/echos-release.jks"
          echo "ECHOS_KEYSTORE_PATH=$RUNNER_TEMP/echos-release.jks" >> "$GITHUB_ENV"
      - name: Build permanent-key release APK
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          ECHOS_KEYSTORE_PASSWORD: ${{ secrets.ECHOS_KEYSTORE_PASSWORD }}
          ECHOS_KEY_ALIAS: ${{ secrets.ECHOS_KEY_ALIAS }}
          ECHOS_KEY_PASSWORD: ${{ secrets.ECHOS_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify permanent-key release APK matches Firebase certificate
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee release-certificate.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.echos.app'"
          grep -Fqi "SHA-1 digest: 07:35:50:11:38:59:f4:87:75:3a:7f:b8:52:5a:0c:a0:96:0e:59:89" release-certificate.txt || {
            echo "ERROR: APK certificate does not match the historical Firebase OAuth SHA-1. Release blocked."
            exit 1
          }
      - name: Upload permanent-key release APK
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ECHOS-APK-RELEASE-SIGNED
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
